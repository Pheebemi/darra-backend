name: Tests

# Runs on every pull request (any target branch) and on pushes to master,
# so a red suite is visible before anything is merged.
on:
  pull_request:
  push:
    branches: [master]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      # DEBUG=True on purpose:
      #  - it skips the production SECRET_KEY guard, so no real key is needed
      #  - it keeps SECURE_SSL_REDIRECT off, so the test client can use http
      DEBUG: "True"
      DJANGO_SECRET_KEY: "ci-not-a-real-secret-key"
      # No DATABASE_URL / MYSQL_DATABASE is set, so settings falls back to
      # SQLite — the suite needs no database service.

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        # A bare `manage.py test` misses the apps/ package, so the labels are
        # listed explicitly. --buffer hides app print() output for passing
        # tests and shows it only on failure.
        run: python manage.py test core users products apps.payments.tests apps.support.tests --buffer

  frontend:
    name: Frontend type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        # Catches TypeScript errors before they reach Vercel. Vercel still runs
        # the full production build; this is the cheap early signal.
        run: npx tsc --noEmit

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python scanners
        run: pip install bandit pip-audit

      # Static analysis of OUR code. Gates the PR (fails the job) on High
      # severity + High confidence findings only — actionable, low false-positive.
      - name: Code scan (bandit)
        working-directory: backend
        run: bandit -r users products apps core -x '*/migrations/*,*/tests.py' -lll -iii

      # Known CVEs in Python dependencies. Advisory (continue-on-error) because
      # new CVEs are published constantly and a transitive one shouldn't block an
      # unrelated PR — Dependabot opens fix PRs for these. Findings still show in
      # the log. Flip continue-on-error to false to make it a hard gate.
      - name: Dependency CVEs — Python (pip-audit)
        working-directory: backend
        continue-on-error: true
        run: pip-audit -r requirements.txt --progress-spinner off

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Known CVEs in frontend dependencies (advisory, same reasoning).
      - name: Dependency CVEs — frontend (pnpm audit)
        working-directory: web
        continue-on-error: true
        run: pnpm audit --audit-level high
