<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ headline }}</title>
</head>
<body style="margin:0; padding:24px; background:#f4f4f5; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; color:#1b1b1f;">
    <div style="max-width:520px; margin:0 auto; background:#ffffff; border:1px solid #e4e4e7; border-radius:8px; padding:32px;">

        <p style="margin:0 0 24px; font-size:18px; font-weight:600; color:#5465FF;">Darra</p>

        <p style="margin:0 0 4px; font-size:16px;">Hi {{ seller_name }},</p>
        <p style="margin:0 0 24px; font-size:15px; line-height:1.5; color:#52525b;">
            {{ message }}
        </p>

        <div style="background:{{ amount_bg }}; border-radius:6px; padding:16px; margin-bottom:24px;">
            <p style="margin:0 0 2px; font-size:13px; color:#71717a;">Payout amount</p>
            <p style="margin:0 0 8px; font-size:24px; font-weight:600; color:{{ amount_color }};">
                &#8358;{{ amount }}
            </p>
            <span style="display:inline-block; background:{{ status_bg }}; color:{{ status_color }}; border-radius:999px; padding:3px 12px; font-size:12px; font-weight:600;">
                {{ status_label }}
            </span>
        </div>

        <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="font-size:14px; margin-bottom:24px;">
            <tr>
                <td style="padding:6px 0; color:#71717a;">Bank</td>
                <td style="padding:6px 0; text-align:right;">{{ bank_name }}</td>
            </tr>
            <tr>
                <td style="padding:6px 0; color:#71717a;">Account</td>
                <td style="padding:6px 0; text-align:right;">{{ account_number }}</td>
            </tr>
            <tr>
                <td style="padding:6px 0; color:#71717a;">Account name</td>
                <td style="padding:6px 0; text-align:right;">{{ account_name }}</td>
            </tr>
            <tr>
                <td style="padding:6px 0; color:#71717a;">Reference</td>
                <td style="padding:6px 0; text-align:right;">{{ reference }}</td>
            </tr>
        </table>

        {% if note %}
        <div style="background:{{ note_bg }}; border-radius:6px; padding:16px; margin-bottom:24px;">
            <p style="margin:0; font-size:14px; line-height:1.6; color:#52525b;">{{ note }}</p>
        </div>
        {% endif %}

        <p style="margin:0;">
            <a href="{{ payouts_url }}" style="display:inline-block; background:#5465FF; color:#ffffff; text-decoration:none; padding:11px 22px; border-radius:999px; font-size:14px; font-weight:500;">
                View payout history
            </a>
        </p>

        <p style="margin:32px 0 0; padding-top:20px; border-top:1px solid #e4e4e7; font-size:13px; color:#a1a1aa;">
            Questions? Just reply to this email.
        </p>
    </div>
</body>
</html>
